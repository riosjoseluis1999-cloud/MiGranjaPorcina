name: TIRIOS AGRO - APK local
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v4
      - name: Eliminar fuentes heredadas de Mi Granja Porcina v0.1
        shell: bash
        run: |
          # GitHub conserva archivos antiguos cuando solo subes nuevos archivos desde la web.
          # La nueva versión usa AgroRepository.kt y pantallas bajo ui/.
          rm -f app/src/main/java/pe/granja/porcina/data/Repository.kt
          rm -f app/src/main/java/pe/granja/porcina/Operations.kt
          rm -f app/src/main/java/pe/granja/porcina/SecurityAndReports.kt
          echo 'Fuentes Kotlin que se van a compilar:'
          find app/src/main/java -type f -name '*.kt' | sort
          test -f app/src/main/java/pe/granja/porcina/data/AgroRepository.kt
          test -f app/src/main/java/pe/granja/porcina/data/Database.kt
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Comprobar estructura
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/pe/granja/porcina/MainActivity.kt
          echo 'Estructura del proyecto correcta'
      - name: Compilar APK de depuración
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
      - name: Mostrar errores si falla
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            echo '--- Errores relevantes ---'
            grep -E '(^e: | error: |^FAILURE:|^\* What went wrong:|^> Task .*FAILED|Compilation error|Could not resolve|Could not find)' build.log | tail -n 100 || true
          else
            echo 'La compilación no comenzó; revisar pasos anteriores.'
          fi
      - name: Guardar registro de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TIRIOS-AGRO-LOG-COMPILACION
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Descargar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TIRIOS-AGRO-v0-2-2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
