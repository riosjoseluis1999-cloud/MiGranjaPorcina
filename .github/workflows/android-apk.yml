name: Compilar APK Android (demo local)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Preparar Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar APK de depuración
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Granja-Porcina-APK-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
